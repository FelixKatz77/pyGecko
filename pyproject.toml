[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pygecko-gc"
dynamic = ["version"]
description = "An open-source Python library for the parsing, processing and analysis of GC/MS and GC/FID raw data"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT License"}
authors = [
    {name = "Felix Katzenburg", email = "felix.katzenburg@uni-muenster.de"},
    {name = "Florian Boser", email = "florian.boser@uni-muenster.de"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "brain_isotopic_distribution>=1.5.14",
    "epam.indigo>=1.13.0",
    "matplotlib>=3.6.2",
    "netCDF4>=1.6.5",
    "numpy>=1.26.3",
    "pandas>=2.0.3",
    "pybaselines>=1.0.0",
    "psims>=1.3.2",
    "pymzml>=2.5.2",
    "pyteomics[xml]>=4.6.2",
    "rdkit>=2023.3.1",
    "reportlab>=4.0.5",
    "scikit-learn>=1.7.2",
    "scipy>=1.11.4",
    "statsmodels>=0.14.0",
    "xarray>=2023.6.0",
]

[project.optional-dependencies]
ord = ["ord-schema>=0.5.9"]
test = ["pytest>=8", "pytest-cov>=5"]
docs = ["sphinx>=7", "sphinx-rtd-theme>=2"]

[project.urls]
Homepage = "https://github.com/FelixKatz77/pyGecko"
Documentation = "https://pygecko.readthedocs.io/en/latest/"
Repository = "https://github.com/FelixKatz77/pyGecko"
Issues = "https://github.com/FelixKatz77/pyGecko/issues"

[tool.setuptools.dynamic]
version = {attr = "pygecko.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["pygecko*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "msconvert: needs a configured msConvert executable (Agilent .D conversion)",
    "realdata: needs the complete extracted Zenodo record configured locally",
    "slow: long-running integration or whole-dataset regression",
]
